name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Linux keyring dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring

      - name: End-to-end tests
        env:
          OPEN_CODE_DESK_E2E_PASSWORD_STORE: gnome-libsecret
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            keyring_password="$(openssl rand -hex 32)"
            eval "$(printf "%s" "$keyring_password" | gnome-keyring-daemon --unlock --components=secrets)"
            unset keyring_password
            xvfb-run --auto-servernum pnpm exec playwright test
          '

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: pnpm package:win
            artifact: open-code-desk-windows-x64
            paths: |
              release/*.exe
              release/*.blockmap
          - name: macOS
            os: macos-latest
            command: pnpm package:mac
            artifact: open-code-desk-macos
            paths: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
          - name: Linux x64
            os: ubuntu-latest
            command: pnpm package:linux
            artifact: open-code-desk-linux-x64
            paths: |
              release/*.AppImage
              release/*.blockmap

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
