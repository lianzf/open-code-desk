name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check documentation
        run: pnpm docs:check

      - name: Check production source size
        run: pnpm source-size:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration test acceptance
        run: pnpm test:integration

      - name: Audit workspace dependencies
        run: pnpm security:dependency-audit

      - name: Scan repository for committed secrets
        run: pnpm security:secrets

      - name: Generate CycloneDX SBOM
        run: pnpm release:sbom

      - name: Audit shipped third-party licenses
        run: pnpm security:licenses

      - name: Performance acceptance
        run: pnpm test:performance

      - name: Build
        run: pnpm build

      - name: Install Linux keyring dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring libsecret-tools

      - name: End-to-end tests
        env:
          OPEN_CODE_DESK_E2E_PASSWORD_STORE: gnome-libsecret
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            keyring_password="$(openssl rand -hex 32)"
            eval "$(printf "%s" "$keyring_password" | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            unset keyring_password
            probe_value="$(openssl rand -hex 32)"
            printf "%s" "$probe_value" | timeout 15s secret-tool store --label="OpenCode Desk CI probe" application open-code-desk-ci
            test "$(timeout 15s secret-tool lookup application open-code-desk-ci)" = "$probe_value"
            timeout 15s secret-tool clear application open-code-desk-ci
            unset probe_value
            xvfb-run --auto-servernum pnpm exec playwright test
          '

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload security metadata
        if: always()
        # Preserve platform build and packaged-app validation when artifact storage is
        # temporarily unavailable. Installer uploads remain mandatory in package jobs,
        # so the workflow still fails when release artifacts cannot be published.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-security-metadata
          path: |
            release/dependency-audit.json
            release/license-audit.json
            release/open-code-desk.cdx.json
            release/secret-scan.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            command: pnpm package:win
            artifact: open-code-desk-windows-x64
            paths: |
              release/*.exe
              release/*.blockmap
              release/*.json
              release/SHA256SUMS.txt
          - name: macOS arm64
            os: macos-15
            platform: macos
            java_architecture: aarch64
            command: pnpm package:mac:arm64
            artifact: open-code-desk-macos-arm64
            paths: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/*.json
              release/SHA256SUMS.txt
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            java_architecture: x64
            command: pnpm package:linux
            artifact: open-code-desk-linux-x64
            paths: |
              release/*.AppImage
              release/*.blockmap
              release/*.json
              release/SHA256SUMS.txt

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up JDK 21 for native Java debugger acceptance
        if: matrix.platform == 'macos' || matrix.platform == 'linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_architecture }}

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native Java debugger acceptance
        if: matrix.platform == 'macos' || matrix.platform == 'linux'
        shell: bash
        env:
          OPEN_CODE_DESK_JAVA_ACCEPTANCE: '1'
        run: |
          export OPEN_CODE_DESK_JAVA_HOME="$JAVA_HOME"
          pnpm exec vitest run apps/desktop/src/main/debug/java/java-debug-adapter.acceptance.test.ts --maxWorkers=1

      - name: Test secure live Provider helper
        if: matrix.name == 'Windows x64'
        shell: pwsh
        run: ./apps/desktop/scripts/test-live-provider-acceptance-helper.ps1

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Smoke test Windows installer
        if: matrix.name == 'Windows x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not created.' }
          & ./apps/desktop/scripts/windows-installer-smoke.ps1 `
            -InstallerPath $installer.FullName `
            -WorkspaceRoot $env:GITHUB_WORKSPACE

      - name: Test installed Windows application
        if: matrix.name == 'Windows x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not created.' }
          & ./apps/desktop/scripts/windows-installed-e2e.ps1 `
            -InstallerPath $installer.FullName `
            -WorkspaceRoot $env:GITHUB_WORKSPACE

      - name: Resolve packaged Unix executable
        if: matrix.name != 'Windows x64'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.name }}' == 'macOS arm64' ]]; then
            executable="$(find release -type f -path '*/OpenCode Desk.app/Contents/MacOS/OpenCode Desk' -print -quit)"
          else
            executable="$GITHUB_WORKSPACE/release/linux-unpacked/open-code-desk"
          fi
          test -n "$executable"
          if [[ "$executable" != /* ]]; then
            executable="$GITHUB_WORKSPACE/$executable"
          fi
          test -x "$executable"
          echo "OPEN_CODE_DESK_E2E_EXECUTABLE_PATH=$executable" >> "$GITHUB_ENV"

      - name: Test packaged macOS application
        if: matrix.name == 'macOS arm64'
        run: pnpm test:e2e:packaged-core

      - name: Install packaged Linux test dependencies
        if: matrix.name == 'Linux x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring libsecret-tools

      - name: Test packaged Linux application
        if: matrix.name == 'Linux x64'
        env:
          OPEN_CODE_DESK_E2E_PASSWORD_STORE: gnome-libsecret
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            keyring_password="$(openssl rand -hex 32)"
            eval "$(printf "%s" "$keyring_password" | gnome-keyring-daemon --daemonize --unlock --components=secrets)"
            unset keyring_password
            xvfb-run --auto-servernum pnpm test:e2e:packaged-core
          '

      - name: Upload packaged end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-e2e-diagnostics-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
