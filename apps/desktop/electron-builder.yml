appId: dev.opencode.desk
productName: OpenCode Desk
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**/*
electronDist: node_modules/electron/dist
afterPack: scripts/after-pack.mjs

directories:
  output: ../../release

files:
  - out/**/*
  - package.json

extraResources:
  - from: vendor/js-debug-1.117.0
    to: js-debug
    filter:
      - '**/*'
  - from: vendor/debugpy-1.8.21
    to: debugpy
    filter:
      - '**/*'
  - from: vendor/jdtls-1.60.0
    to: jdtls
    filter:
      - '**/*'
  - from: vendor/java-debug-0.59.0
    to: java-debug
    filter:
      - '**/*'

publish:
  provider: github
  owner: lianzf
  repo: open-code-desk
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip

linux:
  executableName: open-code-desk
  category: Development
  target:
    - AppImage
